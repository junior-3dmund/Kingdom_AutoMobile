<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Kingdom AutoMobile</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html"><span class="brand-mark">KA</span><span>Kingdom <b>AutoMobile</b><small>DEALERSHIP</small></span></a>
    <button class="menu-btn" aria-label="Open menu">☰</button>
    <nav>
      <a href="index.html">Home</a><a href="stock.html">Stock</a><a href="how.html">How to Buy</a>
      <a href="about.html">About Us</a><a href="contact.html">Contact</a>
      <a class="login" href="login.html">Login</a><a class="signup" href="signup.html">Sign Up</a>
    </nav>
  </div>
</header>

<main class="section container contact">
  <section>
    <div><p class="eyebrow dark">GET IN TOUCH</p><h2>Need help finding a vehicle?</h2><p>Contact Kingdom AutoMobile Dealership and our team will assist you.</p></div>
    <form><input placeholder="Your Name"><input type="email" placeholder="Email Address"><textarea placeholder="Tell us what vehicle you're looking for"></textarea><button>Send Inquiry</button></form>
  </section>
</main>

<footer><div class="container footer"><div class="brand"><span class="brand-mark">KA</span><span>Kingdom <b>AutoMobile</b><small>DEALERSHIP</small></span></div><p>© 2026 Kingdom AutoMobile Dealership. All rights reserved.</p></div></footer>
<script>
(function(){
  const menuBtn = document.querySelector('.menu-btn');
  const nav = document.querySelector('nav');
  if (!menuBtn || !nav) return;
  menuBtn.addEventListener('click', () => nav.classList.toggle('show'));
  nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => nav.classList.remove('show')));
})();
</script>
</body>
</html>
