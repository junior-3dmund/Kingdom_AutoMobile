<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings — Kingdom</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-topbar">
    <div class="container admin-nav">
      <a href="../index.html" class="brand" aria-label="Kingdom home">
        <span class="brand-mark">KA</span>
        <span><b>Kingdom</b><small>AUTOMOBILE</small></span>
      </a>
      <nav class="admin-nav-links">
        <a href="dashboard.html">Overview</a>
        <a href="vehicles.html">Vehicles</a>
        <a href="inquiries.html">Inquiries</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="top-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <span class="dot" aria-hidden="true"></span>
          <span class="small">Light</span>
        </button>
        <a href="login.html" id="logout" class="btn btn-ghost">Logout</a>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <section class="page-header">
      <div>
        <p class="eyebrow dark">ADMIN SETTINGS</p>
        <h1>Security & Operations</h1>
      </div>
      <div class="user-pill">System</div>
    </section>

    <div class="admin-grid">
      <section class="panel">
        <div class="panel-head">
          <h3>Rotate credentials</h3>
          <span class="panel-tag">Security</span>
        </div>
        <form id="rotate-creds" class="admin-form">
          <div><input name="current" placeholder="Current password" type="password" required /></div>
          <div><input name="username" placeholder="New username" required /></div>
          <div><input name="password" placeholder="New password" type="password" required /></div>
          <div class="submit-row"><button class="btn btn-primary" type="submit">Rotate</button></div>
        </form>
        <div id="rotate-result" class="response-box"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h3>Quick generator</h3>
          <span class="panel-tag">CLI</span>
        </div>
        <form id="add-vehicle" class="admin-form">
          <div><input name="id" placeholder="ID (slug)" required /></div>
          <div><input name="title" placeholder="Title" required /></div>
          <div><input name="price" placeholder="Price (GH₵)" required /></div>
          <div><input name="year" placeholder="Year" /></div>
          <div class="submit-row"><button class="btn btn-primary" type="submit">Create CLI Command</button></div>
        </form>
        <pre id="cli-cmd" class="code-box"></pre>
      </section>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
