<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inquiries — Kingdom</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-topbar">
    <div class="container admin-nav">
      <a href="../index.html" class="brand" aria-label="Kingdom home">
        <span class="brand-mark">KA</span>
        <span><b>Kingdom</b><small>AUTOMOBILE</small></span>
      </a>
      <nav class="admin-nav-links">
        <a href="dashboard.html">Overview</a>
        <a href="vehicles.html">Vehicles</a>
        <a href="inquiries.html">Inquiries</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="top-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <span class="dot" aria-hidden="true"></span>
          <span class="small">Light</span>
        </button>
        <a href="login.html" id="logout" class="btn btn-ghost">Logout</a>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <section class="page-header">
      <div>
        <p class="eyebrow dark">CUSTOMER LEADS</p>
        <h1>Inquiries</h1>
      </div>
      <div class="user-pill">Follow-ups</div>
    </section>

    <section class="stats-grid single-row">
      <article class="stat-card accent">
        <span class="label">Open</span>
        <strong id="stat-inquiries">0</strong>
        <small>Customer leads</small>
      </article>
      <article class="stat-card">
        <span class="label">Response</span>
        <strong>1h</strong>
        <small>Target SLA</small>
      </article>
      <article class="stat-card">
        <span class="label">Sales</span>
        <strong>Live</strong>
        <small>Deal pipeline</small>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h3>Recent inquiries</h3>
        <span class="panel-tag">Live</span>
      </div>
      <ul id="inquiry-list" class="list"></ul>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
