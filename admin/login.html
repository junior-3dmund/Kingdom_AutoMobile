<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Kingdom</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .admin-card{max-width:420px;margin:6rem auto;padding:1.5rem;border-radius:8px;background:#fff}
    .admin-card h2{margin:0 0 1rem}
    .field{margin-bottom:0.75rem}
    .error{color:#b00020}
  </style>
</head>
<body>
  <main>
    <div class="admin-card container">
      <h2>Admin Sign In</h2>
      <form id="admin-login">
        <div class="field"><label>Username<input id="username" name="username" required /></label></div>
        <div class="field"><label>Password<input id="password" name="password" type="password" required /></label></div>
        <div class="field"><button type="submit">Sign In</button></div>
        <div id="msg" class="error" role="status" aria-live="polite"></div>
      </form>
      <p>Default demo credentials: <strong>admin / adminpass</strong></p>
    </div>
  </main>
  <script>
    async function loadCreds(){
      try{ const r = await fetch('creds.json'); return await r.json(); }catch(e){return null}
    }

    function hexToBytes(hex){ if(!hex) return new Uint8Array(); const bytes=new Uint8Array(hex.length/2); for(let i=0;i<bytes.length;i++) bytes[i]=parseInt(hex.substr(i*2,2),16); return bytes; }
    function bufToHex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }

    async function derivePBKDF2(password, saltHex, iterations){
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveBits']);
      const salt = hexToBytes(saltHex);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations: iterations || 100000, hash: 'SHA-256'}, key, 256);
      return bufToHex(bits);
    }

    document.getElementById('admin-login').addEventListener('submit', async function(e){
      e.preventDefault();
      const u=document.getElementById('username').value.trim();
      const p=document.getElementById('password').value;
      const creds = await loadCreds();
      if (!creds){ document.getElementById('msg').textContent='Admin creds not found'; return }

      // If creds contain a hash field, verify using PBKDF2; otherwise fallback to plaintext password field
      if (creds.hash){
        try{
          const derived = await derivePBKDF2(p, creds.salt, creds.iterations || 100000);
          if (u===creds.username && derived===creds.hash){ sessionStorage.setItem('adminAuth','1'); sessionStorage.setItem('adminUser',u); window.location.href='dashboard.html'; return }
        }catch(e){ console.error(e); }
      } else if (u===creds.username && p===creds.password){
        sessionStorage.setItem('adminAuth','1'); sessionStorage.setItem('adminUser',u); window.location.href='dashboard.html'; return
      }

      document.getElementById('msg').textContent='Invalid credentials';
    });
  </script>
</body>
</html>
